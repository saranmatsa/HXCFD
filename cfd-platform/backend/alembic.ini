# HX CFD backend — Alembic configuration.
#
# Migrations are local-first, mirroring the rest of the backend. The database
# URL is intentionally NOT set here; the env.py script reads it from
# `cfd_backend.core.config.get_settings()` so a single source of truth governs
# both runtime and migration connectivity. To run Alembic from the backend
# directory:
#
#     backend/.venv/Scripts/python.exe -m alembic -c alembic.ini upgrade head
#
# We deliberately ship NO initial migration yet — the canonical ORM schema
# has not stabilised (see backend/README.md). When the schema is settled, run:
#
#     backend/.venv/Scripts/python.exe -m alembic -c alembic.ini revision \
#         --autogenerate -m "initial schema"
#
# Never hand-edit the [alembic] sqlalchemy.url line below; it is left empty
# so migrations always follow the live DATABASE_URL.

[alembic]
script_location = src/cfd_backend/migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
